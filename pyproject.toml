[project]
name = "langchain-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "langchain>=1.3.11",
    "langchain-chroma>=1.1.0",
    "langchain-community==0.4.1",
    "langchain-openai==1.3.3",
    "langchain-pymupdf4llm>=1.27.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "onnx>=1.22.0",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "typer>=0.25.1",
]


[project.scripts]
Simple_llm="langchain_demo.Simple_llm:main"

[build-system]
requires =["hatchling"]
build-backend = "hatchling.build"
